openapi: 3.0.3
info:
  title: 智慧投資 L.I.V.E. API
  description: |
    Backend API for the 智慧投資 L.I.V.E. hackathon project.
    Provides endpoints for personality analysis, K-line chart data,
    AI consultation, trade execution, community features, and danmaku chat.
  version: 1.0.0

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/prod
    description: AWS API Gateway (Production)
    variables:
      apiId:
        default: xxxxxxxxxx
      region:
        default: ap-northeast-1

tags:
  - name: Core
    description: Core trading and analysis endpoints
  - name: Personality
    description: Investor personality system
  - name: Community
    description: Threads-style social feed
  - name: Chat
    description: Real-time chat and danmaku (barrage)
  - name: Questionnaire
    description: Periodic personality questionnaire
  - name: Recommendation
    description: Algorithm-driven content ranking
  - name: User
    description: User profile and settings
  - name: Notifications
    description: Rule-based market/community alert notifications

paths:
  # ─────────────────────────────────────────────
  # Coin Endpoints
  # ─────────────────────────────────────────────
  /coin/price:
    get:
      tags: [Core]
      summary: Get latest price for a currency
      description: |
        Returns the latest ticker data for the given currency from the MAX
        public API (no authentication required).
        Default quote currency is TWD (e.g. BTC → btctwd market).
      operationId: getCoinPrice
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: BTC
          description: "Coin symbol (e.g. BTC, ETH, SOL, DOGE)"
        - name: quote
          in: query
          required: false
          schema:
            type: string
            default: TWD
            example: TWD
          description: "Quote currency (default: TWD)"
      responses:
        "200":
          description: Latest ticker data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinPriceResponse"
              example:
                status: ready
                currency: BTC
                market: btctwd
                last: 2059233.9
                buy: 2059000.0
                sell: 2061197.9
                open: 2101373.9
                high: 2117830.3
                low: 2059000.0
                vol: 26.5657
                at: 1785504705
        "400":
          description: Missing currency parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "缺少幣種參數 currency"
        "404":
          description: Market not found on MAX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "找不到市場 btcusd，請確認幣種是否正確"
        "502":
          description: MAX API unavailable after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "無法取得幣種價格，請稍後再試"

  # ─────────────────────────────────────────────
  # Core Endpoints
  # ─────────────────────────────────────────────
  /init:
    get:
      tags: [Core]
      summary: Check user initialization status
      description: |
        Called when user enters the app. Returns whether a CSV is already
        stored in S3 for this user (`users/{userId}/trades.csv`) — so the
        frontend does not need to prompt for re-upload on every visit — and
        the list of currencies found in it. This is a lightweight existence
        check only; it does not re-run the personality analysis pipeline
        (that happens via `POST /upload_csv`).
      operationId: getInit
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
      responses:
        "200":
          description: User status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
              examples:
                needCsv:
                  summary: User needs to upload CSV
                  value:
                    status: need_csv
                ready:
                  summary: User is ready
                  value:
                    status: ready
                    currencies: [BTC, ETH, SOL, DOGE]

  /upload_csv:
    post:
      tags: [Core]
      summary: Upload CSV trade records, or re-run analysis on the stored one
      description: |
        Two modes, both handled by this one endpoint:

        - **Upload**: send the raw CSV as the request body (`Content-Type:
          text/csv`). It's saved to `users/{userId}/trades.csv` in S3, then
          the personality analysis pipeline runs (Python metrics → Bedrock
          interpretation) and the result is saved to
          `users/{userId}/trade_metrics.json`.
        - **Re-analyze**: send no body (empty POST). The handler reads the
          previously-uploaded CSV back from S3 and re-runs the same
          pipeline — useful for refreshing the AI description without
          asking the user to upload again. Returns 404 `need_csv` if no
          CSV has ever been uploaded for this user.

        Note: the request body is the raw CSV text, not a
        `multipart/form-data` file upload — the frontend reads the File
        object as text and sends it directly (see
        `frontend/src/services/personalityApi.js`'s `uploadCsvFile()`).
      operationId: uploadCsv
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
      requestBody:
        required: false
        content:
          text/csv:
            schema:
              type: string
              description: |
                Raw CSV content with columns: timestamp (ms), currency,
                price (TWD), action (buy/sell/deposit/withdrawal), change,
                balance. Omit the body entirely to re-analyze the CSV
                already stored in S3 instead of uploading a new one.
      responses:
        "200":
          description: Upload/analysis successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCsvResponse"
        "400":
          description: Invalid CSV format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "CSV 格式不正確，請確認欄位是否完整"
        "404":
          description: No body sent and no previously-uploaded CSV found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: need_csv
                message: "尚未上傳交易紀錄，請先上傳 CSV 檔案"

  /candlestick_chart:
    get:
      tags: [Core]
      summary: Get K-line chart data with trade markers
      description: |
        Returns candlestick data from MAX API merged with the user's
        historical buy/sell markers from their CSV records.
      operationId: getCandlestickChart
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: BTC
          description: Currency symbol (e.g. BTC, ETH, SOL)
        - name: start
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1719792000
          description: Start time (Unix timestamp in seconds)
        - name: end
          in: query
          required: true
          schema:
            type: integer
            format: int64
            example: 1720396800
          description: End time (Unix timestamp in seconds)
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [1d, 1M, 1Y]
            default: 1M
          description: "K-line interval: 1d (daily, 24h range), 1M (monthly, 30d range), 1Y (yearly, 365d range)"
      responses:
        "200":
          description: Chart data with trade markers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlestickChartResponse"
        "502":
          description: MAX API unavailable after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio:
    get:
      tags: [Core]
      summary: Get user's portfolio (holdings, value, P&L)
      description: |
        Reads the user's CSV from S3, FIFO-reduces buy/deposit lots by
        sell/withdrawal volume to get current open positions per currency,
        then looks up each held currency's live price via the MAX public
        API to compute value and unrealized P&L.

        Each holding's price lookup is best-effort: if the MAX API fails
        for one currency, that holding is simply omitted (not the whole
        request) so a partial portfolio is still returned.
      operationId: getPortfolio
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
        - name: quote
          in: query
          required: false
          schema:
            type: string
            default: TWD
          description: Quote currency for price lookups
      responses:
        "200":
          description: Portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
              example:
                status: ready
                total_value: 181640.0
                total_pnl_pct: 4.69
                holdings:
                  - currency: BTC
                    quantity: 0.015
                    avg_cost: 2800000.0
                    current_price: 2850000.0
                    value: 42750.0
                    pnl_pct: 1.79
                    allocation_pct: 23.5
        "400":
          description: Missing user_id or invalid CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No CSV uploaded yet for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: need_csv
                message: "尚未上傳交易紀錄，請先上傳 CSV 檔案"

  /trade_history:
    get:
      tags: [Core]
      summary: Get user's trade summary + per-transaction history
      description: |
        Reads the user's CSV from S3 and returns aggregate stats (total
        trade count, win rate from FIFO-closed round-trips, average
        holding period, most-traded coins) plus a per-transaction list
        (newest first), with each sell row's realized P&L computed from
        its FIFO-matched cost basis.
      operationId: getTradeHistory
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Max number of rows in `history`
      responses:
        "200":
          description: Trade summary + history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeHistoryResponse"
        "400":
          description: Missing user_id, invalid limit, or invalid CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No CSV uploaded yet for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: need_csv
                message: "尚未上傳交易紀錄，請先上傳 CSV 檔案"

  /ai_chat:
    post:
      tags: [Core]
      summary: Send message to AI assistant
      description: |
        User sends a message to the AI. The AI responds with market analysis
        and optionally an investment suggestion. If a suggestion is returned,
        the frontend must display a confirm button before executing.
      operationId: aiChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: AI response (may include trade suggestion)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
              examples:
                withSuggestion:
                  summary: AI suggests a trade
                  value:
                    status: ready
                    message: "根據你的交易習慣和目前恐懼貪婪指數 35，建議買入 ETH"
                    investment_suggestion:
                      currency: ETH
                      action: buy
                      amount: 500
                chatOnly:
                  summary: AI responds without suggestion
                  value:
                    status: ready
                    message: "目前市場處於中性區間，建議觀望"
                    investment_suggestion: null
        "503":
          description: AI service unavailable after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /allow_trade:
    post:
      tags: [Core]
      summary: Confirm and execute a trade
      description: |
        User confirms a trade suggested by AI. Calls MAX Skill to execute
        the order. On success, the trade is written back to S3 CSV.
      operationId: allowTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowTradeRequest"
      responses:
        "200":
          description: Trade executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowTradeResponse"
              example:
                status: success
                message: "成功買入 500 TWD 的 ETH"
                trade_id: "txn_abc123"
        "400":
          description: Insufficient balance or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "餘額不足"
        "502":
          description: MAX API / Skill unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # Personality Endpoints
  # ─────────────────────────────────────────────
  /personality:
    get:
      tags: [Personality]
      summary: Get user personality profile
      description: |
        Read-only lookup of the user's previously-computed 4-axis
        personality scores + AI-generated description, stored at
        `users/{userId}/trade_metrics.json`. This does NOT trigger a new
        analysis (no Bedrock call) — it just reads back whatever
        `POST /upload_csv` or `POST /personality` last saved. Use
        `POST /upload_csv` with no body to refresh the analysis instead.
      operationId: getPersonality
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
      responses:
        "200":
          description: Personality profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalityResponse"
        "404":
          description: No personality data yet (CSV not uploaded / not analyzed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: need_csv
                message: "尚未完成人格分析，請先上傳 CSV 檔案"
    post:
      tags: [Personality]
      summary: Save questionnaire-derived personality scores
      description: |
        Saves 4-axis personality scores derived from the questionnaire
        (rather than CSV analysis) to the same
        `users/{userId}/trade_metrics.json` location, generating an AI
        description via Bedrock in the process. Used by QuestionnairePage.
      operationId: savePersonality
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: "MVP has no login — frontend supplies a fixed/local user id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personality]
              properties:
                personality:
                  type: object
                  required: [code, name, axes]
                  properties:
                    code:
                      type: string
                      example: "ACSQ"
                    name:
                      type: string
                      example: "狙擊手"
                    axes:
                      type: object
                      properties:
                        R: { type: number, minimum: 0, maximum: 100 }
                        E: { type: number, minimum: 0, maximum: 100 }
                        F: { type: number, minimum: 0, maximum: 100 }
                        S: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalityResponse"
        "400":
          description: Missing personality data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # Community Endpoints
  # ─────────────────────────────────────────────
  /community/feed:
    get:
      tags: [Community]
      summary: Get social feed (algorithm-ranked)
      description: |
        Returns community posts ranked by the recommendation algorithm.
        Priority: same-coin → same-personality → high-engagement → trending.
        Includes questionnaire prompts interspersed like ads.
      operationId: getCommunityFeed
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor for infinite scroll
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          description: Number of posts to return
      responses:
        "200":
          description: Feed items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityFeedResponse"

  /community/post:
    post:
      tags: [Community]
      summary: Create a community post
      operationId: createCommunityPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostItem"

  /community/post/{postId}/like:
    post:
      tags: [Community]
      summary: Like / unlike a post
      operationId: toggleLike
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  like_count:
                    type: integer

  /community/post/{postId}/comments/{commentId}/like:
    post:
      tags: [Community]
      summary: Like / unlike a comment
      description: |
        Toggles a like on a single comment (floor). Independent from the
        parent post's like count.
      operationId: toggleCommentLike
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  like_count:
                    type: integer

  /community/post/{postId}/comments:
    get:
      tags: [Community]
      summary: Get comments on a post (floor-numbered thread)
      description: |
        Returns comments for a post as a flat, floor-numbered thread — no
        nested replies. Comments are sorted ascending by `created_at`
        (oldest first) and `floor` is assigned in that same order starting
        at 1, so 1F is always the earliest comment. Floor numbers are
        permanent and never renumbered (e.g. if 2F is deleted, floors stay
        1F, 3F, 4F...).
      operationId: getPostComments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of comments, oldest first (1F, 2F, 3F...)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsResponse"
    post:
      tags: [Community]
      summary: Add a comment to a post
      description: |
        Adds a new comment at the end of the thread (highest floor number).
        Comments do not support nested replies — every comment is a
        top-level floor entry. Comments support likes and tips independently
        from the parent post's like/tip counts.
      operationId: addComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 500
                images:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 4
                  description: Image URLs attached to the comment (uploaded separately, referenced here by URL)
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentItem"

  /tipping:
    post:
      tags: [Community]
      summary: Send a virtual tip (積分) to a post or comment
      description: |
        Sends virtual points from the current user to the author of a post
        or a comment (floor). Points are virtual only — no real crypto
        asset transfer. Tip counts on posts and comments are tracked
        independently (`tip_count` on `PostItem` / `CommentItem`).
      operationId: sendTip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTipRequest"
      responses:
        "200":
          description: Tip sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendTipResponse"
        "400":
          description: Insufficient points balance or invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # Chat / Danmaku Endpoints
  # ─────────────────────────────────────────────
  /chat/{symbol}/messages:
    get:
      tags: [Chat]
      summary: Get chat messages for a coin channel
      description: |
        Fetch recent chat/danmaku messages for a specific coin's live stream.
        Used for both the chat room tab and danmaku overlay.
      operationId: getChatMessages
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: BTC
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Unix timestamp — only return messages after this time (for polling)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"

  /chat/{symbol}/send:
    post:
      tags: [Chat]
      summary: Send a chat message (also appears as danmaku)
      description: |
        Send a message to the coin's chat room. The message will appear
        in the chat tab and optionally fly across the K-line chart as danmaku
        for other users who have danmaku enabled.
      operationId: sendChatMessage
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: ETH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageItem"

  # ─────────────────────────────────────────────
  # Questionnaire Endpoints
  # ─────────────────────────────────────────────
  /questionnaire:
    get:
      tags: [Questionnaire]
      summary: Get current questionnaire
      description: |
        Returns a set of questions for the user. Questions vary each time
        (not repetitive). Can be served at registration or periodically
        in the social feed.
      operationId: getQuestionnaire
      responses:
        "200":
          description: Questionnaire questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireResponse"

  /questionnaire/submit:
    post:
      tags: [Questionnaire]
      summary: Submit questionnaire answers
      description: |
        Submit answers to the questionnaire. Returns personality feedback
        and optionally asks about personality shift reasons.
      operationId: submitQuestionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireSubmitRequest"
      responses:
        "200":
          description: Submission result with feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireSubmitResponse"

  # ─────────────────────────────────────────────
  # Market Endpoints
  # ─────────────────────────────────────────────
  /market/fear-greed:
    get:
      tags: [Core]
      summary: Get Fear & Greed Index
      description: |
        Returns the CoinMarketCap Crypto Fear & Greed Index.
        Uses the keyless public endpoint by default; set the CMC_API_KEY
        environment variable to switch to the authenticated endpoint.

        **mode=latest** (default): single current reading (updates ~15 min).
        **mode=historical**: paginated daily history, newest-first.
      operationId: getFearGreed
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [latest, historical]
            default: latest
          description: "latest = current value, historical = paginated history"
        - name: start
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: "Historical mode: starting offset (1-indexed)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 30
          description: "Historical mode: number of records to return"
      responses:
        "200":
          description: Fear & Greed Index data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FearGreedResponse"
              examples:
                latest:
                  summary: Latest index value
                  value:
                    status: ready
                    mode: latest
                    data:
                      value: 40
                      value_classification: Fear
                      update_time: "2024-09-19T02:54:56.017Z"
                historical:
                  summary: Historical values
                  value:
                    status: ready
                    mode: historical
                    data:
                      - timestamp: "2024-09-02T12:00:00.000Z"
                        value: 50
                        value_classification: Neutral
                      - timestamp: "2024-09-01T12:00:00.000Z"
                        value: 35
                        value_classification: Fear
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: CMC API unreachable after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "無法取得恐懼貪婪指數，請稍後再試"
        "503":
          description: CMC API returned an unexpected response shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/overview:
    get:
      tags: [Core]
      summary: Get market overview (行情看板)
      description: |
        Powers the main page's market overview widget: Fear & Greed index,
        BTC dominance, total market cap, 24h volume, and top gainers/losers.
        All data sourced from CoinMarketCap's keyless public endpoints.

        Each data source is fetched independently — a failure in one does
        NOT fail the whole response; that field is simply omitted (null or
        []) so the frontend can fall back to mock data for just that piece.
        Only returns 502 if every data source failed.
      operationId: getMarketOverview
      parameters:
        - name: top_n
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 3
          description: Number of entries to return in top_gainers/top_losers
      responses:
        "200":
          description: Market overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverviewResponse"
              example:
                status: ready
                fear_greed: { value: 38, label: Fear }
                btc_dominance: 58.2
                total_market_cap: 3120000000000.0
                volume_24h: 98500000000.0
                top_gainers:
                  - { symbol: PEPE, change_24h: 15.2 }
                  - { symbol: WIF, change_24h: 8.9 }
                  - { symbol: SOL, change_24h: 5.7 }
                top_losers:
                  - { symbol: ETH, change_24h: -1.2 }
                  - { symbol: ADA, change_24h: -0.8 }
                  - { symbol: LINK, change_24h: -2.1 }
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: All CoinMarketCap data sources unreachable after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # Notification Endpoints
  # ─────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: Get dynamic market/community alert notifications
      description: |
        Returns a rule-based list of alert notifications for the top
        notification banner (NotificationBanner.jsx). Rules run against
        live CoinMarketCap data on every call (no persistence/scheduling —
        see task notes for the simple-vs-scheduled tradeoff):

        - **price_mover**: any top-100-by-market-cap coin whose 24h %
          change exceeds ±`price_change_threshold` (default 10%).
        - **fear_greed**: the current Fear & Greed Index classification
          (e.g. entering "Fear" or "Extreme Greed").
        - **whale_alert** / **social_buzz**: no real data source exists yet
          (see backend/.kiro platform-features.md) — deterministically
          seeded from the current hour so the same alert doesn't repeat
          every request, clearly not derived from live external data.

        Returns an empty list (never an error) if the CMC calls fail —
        a missing notification is not worth failing the endpoint over;
        the frontend already falls back to its own mock strings.
      operationId: getNotifications
      parameters:
        - name: price_change_threshold
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 10
          description: "Minimum absolute 24h %% change to trigger a price_mover alert"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
          description: Max number of notifications to return
      responses:
        "200":
          description: List of current notifications (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
              example:
                status: ready
                notifications:
                  - id: "price_mover-PEPE-1785600000"
                    type: price_mover
                    icon: "📈"
                    text: "PEPE 24H 漲幅 +15.2%，注意波動"
                    created_at: "2026-08-01T06:00:00Z"
                  - id: "fear_greed-1785600000"
                    type: fear_greed
                    icon: "📊"
                    text: "恐懼貪婪指數降至 38（恐慌），歷史上是進場好時機"
                    created_at: "2026-08-01T06:00:00Z"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # Recommendation Endpoints
  # ─────────────────────────────────────────────
  /recommend/coins:
    get:
      tags: [Recommendation]
      summary: Get personalized coin recommendations
      description: |
        Returns coins ordered by the recommendation algorithm:
        - 平時關注: based on user's trading frequency per coin
        - 熱門: most-watched/traded across all users
        - 潛力: highest recent attention growth rate
      operationId: getRecommendedCoins
      responses:
        "200":
          description: Categorized coin recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendCoinsResponse"

  /recommend/similar-users:
    get:
      tags: [Recommendation]
      summary: Get similar users' trading behavior
      description: |
        Returns aggregated trading behavior of users with same personality
        type or same coin interests. Used as AI fallback when insufficient
        data for direct recommendation.
      operationId: getSimilarUsers
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific coin
      responses:
        "200":
          description: Similar users' behavior summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarUsersResponse"

  # ─────────────────────────────────────────────
  # User Endpoints
  # ─────────────────────────────────────────────
  /user/profile:
    get:
      tags: [User]
      summary: Get user profile
      description: |
        Returns user info including personality title (4-letter code),
        display name, and preferences.
      operationId: getUserProfile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/settings:
    put:
      tags: [User]
      summary: Update user settings
      description: |
        Update user preferences such as danmaku on/off, danmaku size,
        default time interval, indicator toggles, etc.
      operationId: updateUserSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

# ═══════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════
components:
  schemas:
    # ─── Common ───
    FearGreedResponse:
      type: object
      required: [status, mode, data]
      properties:
        status:
          type: string
          enum: [ready]
        mode:
          type: string
          enum: [latest, historical]
        data:
          oneOf:
            - $ref: "#/components/schemas/FearGreedLatest"
            - type: array
              items:
                $ref: "#/components/schemas/FearGreedHistoricalEntry"

    FearGreedLatest:
      type: object
      required: [value, value_classification, update_time]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          description: Fear & Greed score (0 = Extreme Fear, 100 = Extreme Greed)
        value_classification:
          type: string
          enum: [Extreme Fear, Fear, Neutral, Greed, Extreme Greed]
        update_time:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of last update

    FearGreedHistoricalEntry:
      type: object
      required: [timestamp, value, value_classification]
      properties:
        timestamp:
          type: string
          description: |
            Timestamp for this reading. The keyless public endpoint returns
            a Unix epoch seconds string (e.g. "1785369600"); the authenticated
            endpoint returns ISO-8601 UTC. Consumers should handle both forms.
        value:
          type: integer
          minimum: 0
          maximum: 100
        value_classification:
          type: string
          enum: [Extreme Fear, Fear, Neutral, Greed, Extreme Greed]

    MarketOverviewResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
        fear_greed:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MarketOverviewFearGreed"
          description: null if the Fear & Greed data source failed
        btc_dominance:
          type: number
          nullable: true
          description: "BTC dominance as a percentage (e.g. 58.2), null if unavailable"
        total_market_cap:
          type: number
          nullable: true
          description: Total crypto market cap in USD, null if unavailable
        volume_24h:
          type: number
          nullable: true
          description: Total 24h trading volume in USD, null if unavailable
        top_gainers:
          type: array
          items:
            $ref: "#/components/schemas/MarketMover"
          description: Top N coins by 24h % change, descending (empty if unavailable)
        top_losers:
          type: array
          items:
            $ref: "#/components/schemas/MarketMover"
          description: Bottom N coins by 24h % change, ascending (empty if unavailable)

    MarketOverviewFearGreed:
      type: object
      required: [value, label]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
        label:
          type: string
          description: "e.g. Fear, Neutral, Greed"

    MarketMover:
      type: object
      required: [symbol, change_24h]
      properties:
        symbol:
          type: string
          example: PEPE
        change_24h:
          type: number
          description: 24h price change percentage
          example: 15.2

    NotificationsResponse:
      type: object
      required: [status, notifications]
      properties:
        status:
          type: string
          enum: [ready]
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"

    NotificationItem:
      type: object
      required: [id, type, icon, text, created_at]
      properties:
        id:
          type: string
          description: Stable id for this alert instance (dedupe key on the frontend)
        type:
          type: string
          enum: [price_mover, fear_greed, whale_alert, social_buzz]
          description: |
            price_mover / fear_greed are computed from live CoinMarketCap
            data. whale_alert / social_buzz have no real data source yet
            and are deterministically mock-generated (see operation
            description) — treat them as illustrative, not factual.
        icon:
          type: string
          example: "📈"
        text:
          type: string
          description: Human-readable notification text (Chinese)
          example: "PEPE 24H 漲幅 +15.2%，注意波動"
        created_at:
          type: string
          format: date-time

    CoinPriceResponse:
      type: object
      required: [status, currency, market, last, buy, sell, open, high, low, vol, at]
      properties:
        status:
          type: string
          enum: [ready]
        currency:
          type: string
          description: Requested coin symbol (e.g. BTC)
        market:
          type: string
          description: MAX market ID (e.g. btctwd)
        last:
          type: number
          description: Latest trade price
        buy:
          type: number
          description: Best bid price
        sell:
          type: number
          description: Best ask price
        open:
          type: number
          description: 24h open price
        high:
          type: number
          description: 24h high price
        low:
          type: number
          description: 24h low price
        vol:
          type: number
          description: 24h volume (base currency)
        at:
          type: integer
          format: int64
          description: Server timestamp (Unix seconds)

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          description: Human-readable error message (Chinese)

    # ─── Core ───
    InitResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [need_csv, ready]
        currencies:
          type: array
          items:
            type: string
          description: List of currencies found in user's CSV (only when status=ready)

    UploadCsvResponse:
      type: object
      required: [status, currencies, scores]
      properties:
        status:
          type: string
          enum: [ready]
        currencies:
          type: array
          items:
            type: string
        personality_description:
          type: string
          description: Short AI-generated description (~30 Chinese characters)
        personality_analysis:
          type: string
          description: Longer AI-generated analysis, empty string if Bedrock call failed
        scores:
          $ref: "#/components/schemas/PersonalityScores"

    CandlestickChartResponse:
      type: object
      required: [status, candles]
      properties:
        status:
          type: string
          enum: [ready]
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        trade_markers:
          type: array
          items:
            $ref: "#/components/schemas/TradeMarker"
          description: User's historical buy/sell points overlaid on chart

    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: integer
          format: int64
          description: Unix timestamp
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    TradeMarker:
      type: object
      required: [time, action, price]
      properties:
        time:
          type: integer
          format: int64
        action:
          type: string
          enum: [buy, sell]
        price:
          type: number
        amount:
          type: number
          description: Trade amount in TWD

    PortfolioResponse:
      type: object
      required: [status, total_value, total_pnl_pct, holdings]
      properties:
        status:
          type: string
          enum: [ready]
        total_value:
          type: number
          description: Sum of all holdings' current value (only currencies with a successful price lookup)
        total_pnl_pct:
          type: number
          description: Weighted unrealized P&L across all holdings, based on FIFO average cost
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioHolding"

    PortfolioHolding:
      type: object
      required: [currency, quantity, avg_cost, current_price, value, pnl_pct, allocation_pct]
      properties:
        currency:
          type: string
          example: BTC
        quantity:
          type: number
          description: Current open position size (FIFO-reduced buy/deposit minus sell/withdrawal)
        avg_cost:
          type: number
          description: Weighted average cost of the remaining open lots
        current_price:
          type: number
          description: Live price from MAX API
        value:
          type: number
          description: "quantity × current_price"
        pnl_pct:
          type: number
          description: "(current_price − avg_cost) / avg_cost × 100"
        allocation_pct:
          type: number
          description: This holding's share of total_value

    TradeHistoryResponse:
      type: object
      required: [status, summary, history]
      properties:
        status:
          type: string
          enum: [ready]
        summary:
          $ref: "#/components/schemas/TradeSummary"
        history:
          type: array
          items:
            $ref: "#/components/schemas/TradeHistoryItem"
          description: Per-transaction rows, newest first

    TradeSummary:
      type: object
      required: [total_trades, win_rate, avg_hold_days, top_coins]
      properties:
        total_trades:
          type: integer
          description: Count of buy+sell transactions (deposit/withdrawal excluded)
        win_rate:
          type: number
          description: "% of FIFO-closed round-trips with positive P&L"
        avg_hold_days:
          type: number
          description: Average holding period across FIFO-closed round-trips, in days
        top_coins:
          type: array
          items:
            type: string
          description: Most-traded currencies by transaction count, descending

    TradeHistoryItem:
      type: object
      required: [timestamp_ms, action, currency, amount_twd, price, pnl_pct]
      properties:
        timestamp_ms:
          type: integer
          format: int64
        action:
          type: string
          enum: [buy, sell]
        currency:
          type: string
        amount_twd:
          type: number
        price:
          type: number
        pnl_pct:
          type: number
          nullable: true
          description: Realized P&L % from FIFO-matched cost basis; null for buy rows

    AiChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User's message to AI
          maxLength: 2000
        currency:
          type: string
          description: Current coin context (if on a specific coin's page)

    AiChatResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ready]
        message:
          type: string
          description: AI's response text
        investment_suggestion:
          nullable: true
          $ref: "#/components/schemas/InvestmentSuggestion"

    InvestmentSuggestion:
      type: object
      required: [currency, action, amount]
      properties:
        currency:
          type: string
          description: e.g. BTC, ETH
        action:
          type: string
          enum: [buy, sell]
        amount:
          type: number
          description: Suggested amount in TWD

    AllowTradeRequest:
      type: object
      required: [currency, action, amount]
      properties:
        currency:
          type: string
        action:
          type: string
          enum: [buy, sell]
        amount:
          type: number
          description: Amount in TWD

    AllowTradeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        trade_id:
          type: string
          description: Transaction ID from MAX

    # ─── Personality ───
    # NOTE: this reflects what upload_csv.py / save_personality.py / get_personality.py
    # actually implement — 4 numeric 0-100 scores (R=Risk, E=Emotion, F=Frequency,
    # S=Strategy), not the title_code/pole-based shape from the original product
    # design doc. The frontend derives the 4-letter code + Chinese pole labels
    # from these scores itself (see ProfilePage.jsx's `_buildPersonalityFromScores`).
    PersonalityResponse:
      type: object
      required: [status, scores]
      properties:
        status:
          type: string
          enum: [ready]
        personality_description:
          type: string
          description: Short AI-generated description (~30 Chinese characters)
        personality_analysis:
          type: string
          description: Longer AI-generated analysis, empty string if Bedrock call failed
        scores:
          $ref: "#/components/schemas/PersonalityScores"

    PersonalityScores:
      type: object
      required: [r_score, e_score, f_score, s_score]
      properties:
        r_score:
          type: number
          minimum: 0
          maximum: 100
          description: "Risk axis: Defensive (0) vs. Aggressive (100)"
        e_score:
          type: number
          minimum: 0
          maximum: 100
          description: "Emotion axis: Calm (0) vs. Emotional (100)"
        f_score:
          type: number
          minimum: 0
          maximum: 100
          description: "Frequency axis: Long-term (0) vs. Short-term (100)"
        s_score:
          type: number
          minimum: 0
          maximum: 100
          description: "Strategy axis: Intuitive (0) vs. Quantitative (100)"

    # ─── Community ───
    CommunityFeedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for next page (null if no more)

    FeedItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [post, questionnaire_prompt]
          description: "post = user post, questionnaire_prompt = periodic questionnaire ad"
        post:
          $ref: "#/components/schemas/PostItem"
        questionnaire_prompt:
          type: object
          properties:
            message:
              type: string
              description: Prompt text to encourage user to take questionnaire

    PostItem:
      type: object
      required: [id, author, content, created_at]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
          maxItems: 4
          description: Image URLs attached to the post
        currency_tags:
          type: array
          items:
            type: string
          description: Coins mentioned in the post
        like_count:
          type: integer
        comment_count:
          type: integer
        liked_by_me:
          type: boolean
        tip_count:
          type: integer
          description: Total virtual points tipped on this post
        created_at:
          type: string
          format: date-time

    PostAuthor:
      type: object
      required: [user_id, display_name, personality_title]
      properties:
        user_id:
          type: string
        display_name:
          type: string
        personality_title:
          type: string
          description: "4-letter personality code shown as prefix"
          example: "安保計追"

    CreatePostRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1000
        images:
          type: array
          items:
            type: string
            format: uri
          maxItems: 4
          description: Image URLs attached to the post (uploaded separately, referenced here by URL)
        currency_tags:
          type: array
          items:
            type: string
          description: Coins to tag in the post

    SendTipRequest:
      type: object
      required: [target_type, target_id, amount]
      properties:
        target_type:
          type: string
          enum: [post, comment]
          description: Whether the tip goes to a post or a comment (floor)
        target_id:
          type: string
          description: "postId (if target_type=post) or commentId (if target_type=comment)"
        amount:
          type: integer
          minimum: 1
          description: Virtual points to send
          example: 5

    SendTipResponse:
      type: object
      required: [target_type, target_id, tip_count]
      properties:
        target_type:
          type: string
          enum: [post, comment]
        target_id:
          type: string
        tip_count:
          type: integer
          description: Updated total tip count on the target

    CommentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentItem"
        next_cursor:
          type: string
          nullable: true

    CommentItem:
      type: object
      required: [id, floor, author, content, created_at]
      properties:
        id:
          type: string
        floor:
          type: integer
          minimum: 1
          description: |
            Permanent floor number (1F = earliest comment). Assigned once at
            creation based on chronological order and never renumbered, even
            if earlier comments are later deleted. Comments have no nested
            replies — every comment is a flat, top-level floor entry.
          example: 1
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
          maxItems: 4
          description: Image URLs attached to the comment
        like_count:
          type: integer
        liked_by_me:
          type: boolean
        tip_count:
          type: integer
          description: |
            Total virtual points tipped on this comment. Independent from
            the parent post's like_count/tip_count.
        created_at:
          type: string
          format: date-time

    # ─── Chat / Danmaku ───
    ChatMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageItem"

    ChatMessageItem:
      type: object
      required: [id, author, content, timestamp]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/PostAuthor"
        content:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds

    SendChatRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 200
          description: Chat message text (also used as danmaku)

    # ─── Questionnaire ───
    QuestionnaireResponse:
      type: object
      required: [id, questions]
      properties:
        id:
          type: string
          description: Questionnaire session ID
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionItem"

    QuestionItem:
      type: object
      required: [id, text, options]
      properties:
        id:
          type: string
        text:
          type: string
          description: Question text (Chinese)
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string

    QuestionnaireSubmitRequest:
      type: object
      required: [questionnaire_id, answers]
      properties:
        questionnaire_id:
          type: string
        answers:
          type: array
          items:
            type: object
            required: [question_id, option_id]
            properties:
              question_id:
                type: string
              option_id:
                type: string
        shift_reason:
          type: string
          nullable: true
          description: |
            User-provided reason for personality shift
            (prompted if AI detects significant change)

    QuestionnaireSubmitResponse:
      type: object
      required: [personality]
      properties:
        personality:
          $ref: "#/components/schemas/PersonalityResponse"
        shift_detected:
          type: boolean
          description: Whether a personality shift was detected
        shift_message:
          type: string
          nullable: true
          description: "e.g. 你的人格近期有小幅度的轉變..."

    # ─── Recommendation ───
    RecommendCoinsResponse:
      type: object
      required: [focus, trending, rising]
      properties:
        focus:
          type: array
          items:
            $ref: "#/components/schemas/CoinRecommendation"
          description: "平時關注 — coins user trades most"
        trending:
          type: array
          items:
            $ref: "#/components/schemas/CoinRecommendation"
          description: "熱門 — most popular across all users"
        rising:
          type: array
          items:
            $ref: "#/components/schemas/CoinRecommendation"
          description: "潛力 — highest recent attention growth"

    CoinRecommendation:
      type: object
      required: [symbol, name, price, change_24h]
      properties:
        symbol:
          type: string
          example: BTC
        name:
          type: string
          example: Bitcoin
        price:
          type: number
          description: Current price in TWD
        change_24h:
          type: number
          description: 24h price change percentage
        mini_chart:
          type: array
          items:
            type: number
          description: Last 7 close prices for sparkline thumbnail

    SimilarUsersResponse:
      type: object
      properties:
        same_personality:
          $ref: "#/components/schemas/UserBehaviorSummary"
        same_coin_interest:
          $ref: "#/components/schemas/UserBehaviorSummary"
        trending:
          $ref: "#/components/schemas/UserBehaviorSummary"

    UserBehaviorSummary:
      type: object
      properties:
        user_count:
          type: integer
          description: Number of users in this group
        dominant_action:
          type: string
          enum: [buy, sell, hold]
          description: What most users in this group are doing
        avg_confidence:
          type: number
          description: Average confidence level (0-100)
        summary:
          type: string
          description: Natural language summary (Chinese)

    # ─── User ───
    UserProfile:
      type: object
      required: [user_id, display_name, personality_title]
      properties:
        user_id:
          type: string
        display_name:
          type: string
        personality_title:
          type: string
          description: "4-letter code (e.g. 熱冒計逆)"
        has_csv:
          type: boolean
        currencies:
          type: array
          items:
            type: string
        settings:
          $ref: "#/components/schemas/UserSettings"

    UserSettings:
      type: object
      properties:
        danmaku_enabled:
          type: boolean
          default: true
        danmaku_size:
          type: string
          enum: [small, medium, large]
          default: medium
        default_interval:
          type: string
          enum: [1d, 1M, 1Y]
          default: 1M
        indicators_enabled:
          type: array
          items:
            type: string
          description: "List of enabled indicators (empty by default)"
          default: []

    UserSettingsUpdate:
      type: object
      properties:
        danmaku_enabled:
          type: boolean
        danmaku_size:
          type: string
          enum: [small, medium, large]
        default_interval:
          type: string
          enum: [1d, 1M, 1Y]
        indicators_enabled:
          type: array
          items:
            type: string
