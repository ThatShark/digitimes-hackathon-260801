AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  智慧投資 L.I.V.E. Backend API — Lambda + API Gateway

Parameters:
  BedrockModelId:
    Type: String
    Default: "openai.gpt-oss-120b-1:0"
    Description: Bedrock model ID for AI chat
  BedrockRegion:
    Type: String
    Default: "us-west-2"
    Description: AWS region for Bedrock Runtime

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        TRADES_BUCKET_NAME: !Ref TradesBucket

Resources:
  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
        - "text/csv"
        - "multipart/form-data"
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ─────────────────────────────────────────────
  # Lambda Functions
  # ─────────────────────────────────────────────
  CoinPriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-coin-price"
      Handler: src.handlers.coin_price.lambda_handler
      CodeUri: .
      Events:
        GetCoinPrice:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /coin/price
            Method: GET

  FearGreedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fear-greed"
      Handler: src.handlers.fear_greed.lambda_handler
      CodeUri: .
      Events:
        GetFearGreed:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /market/fear-greed
            Method: GET

  MarketOverviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-market-overview"
      Handler: src.handlers.market_overview.lambda_handler
      CodeUri: .
      Events:
        GetMarketOverview:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /market/overview
            Method: GET

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notifications"
      Handler: src.handlers.notifications.lambda_handler
      CodeUri: .
      Events:
        GetNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /notifications
            Method: GET

  CandlestickChartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-candlestick-chart"
      Handler: src.handlers.candlestick_chart.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        GetCandlestickChart:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /candlestick_chart
            Method: GET

  InitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-init"
      Handler: src.handlers.init.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        GetInit:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /init
            Method: GET

  PortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-portfolio"
      Handler: src.handlers.portfolio.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        GetPortfolio:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /portfolio
            Method: GET

  TradeHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-trade-history"
      Handler: src.handlers.trade_history.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        GetTradeHistory:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /trade_history
            Method: GET

  GetPersonalityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-personality"
      Handler: src.handlers.get_personality.lambda_handler
      CodeUri: .
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        GetPersonality:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /personality
            Method: GET

  UploadCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-upload-csv"
      Handler: src.handlers.upload_csv.lambda_handler
      CodeUri: .
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TradesBucket
      Events:
        PostUploadCsv:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /upload_csv
            Method: POST

  AiChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ai-chat"
      Handler: src.handlers.ai_chat.lambda_handler
      CodeUri: .
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - S3ReadPolicy:
            BucketName: !Ref TradesBucket
      Events:
        PostAiChat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /ai_chat
            Method: POST

  SavePersonalityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-save-personality"
      Handler: src.handlers.save_personality.lambda_handler
      CodeUri: .
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - S3CrudPolicy:
            BucketName: !Ref TradesBucket
      Events:
        PostPersonality:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /personality
            Method: POST

  # ─────────────────────────────────────────────
  # S3 Bucket for trade data
  # ─────────────────────────────────────────────
  TradesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL (prod stage)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  TradesBucketName:
    Description: S3 bucket for user trade CSVs and metrics
    Value: !Ref TradesBucket
